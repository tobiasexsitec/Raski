<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Raski&trade;</title>
    <base href="/" />
    <script>
        // Set at runtime so index.html stays unmodified after publish (service worker integrity hashes).
        if (location.hostname.endsWith('.github.io')) {
            document.querySelector('base').setAttribute('href', '/Raski/');
        }
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Raski.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
    <script>
        // Apply the stored theme before first paint to avoid a flash of the wrong theme.
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('raski-theme'); } catch (e) { }
            var resolved = (!stored || stored === 'system')
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : stored;
            document.documentElement.setAttribute('data-theme', resolved);
        })();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Ett ov&#228;ntat fel har intr&#228;ffat.
        <a href="." class="reload">Ladda om</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        (function () {
            if (!('serviceWorker' in navigator)) return;

            // Only reload when an existing worker is replaced (not on first install), and only once.
            var hadController = !!navigator.serviceWorker.controller;
            var reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!hadController || reloading) return;
                reloading = true;
                location.reload();
            });

            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(function (registration) {
                function checkForUpdate() {
                    if (document.visibilityState === 'visible') {
                        registration.update().catch(function () { });
                    }
                }
                document.addEventListener('visibilitychange', checkForUpdate);
                window.addEventListener('focus', checkForUpdate);
            });
        })();
    </script>
</body>

</html>
