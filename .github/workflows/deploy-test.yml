name: Deploy to test environment

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-environment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Swapped in before publish so the service worker asset hashes match the deployed file.
      - name: Use test configuration
        run: |
          cp deploy/test/appsettings.json Raski/Raski/wwwroot/appsettings.json
          PROJECT_ID=$(jq -r '.Firebase.projectId' deploy/test/appsettings.json)
          if [[ -z "$PROJECT_ID" || "$PROJECT_ID" == REPLACE_WITH* ]]; then
            echo "::error::deploy/test/appsettings.json saknar testprojektets Firebase-konfiguration."
            exit 1
          fi
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      # Test builds get <csproj version>-rc.N, where N is the number of commits since the latest release tag.
      - name: Compute release candidate version
        run: |
          BASE=$(grep -oPm1 '(?<=<Version>)[^<]+' Raski/Raski/Raski.csproj)
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)
          if [[ -n "$LAST_TAG" ]]; then
            N=$(git rev-list --count "$LAST_TAG"..HEAD)
          else
            N=$(git rev-list --count HEAD)
          fi
          echo "RC_VERSION=$BASE-rc.$N" >> "$GITHUB_ENV"
          echo "Version: $BASE-rc.$N (since ${LAST_TAG:-start})"

      - name: Publish
        run: dotnet publish Raski/Raski/Raski.csproj -c Release -p:Version="$RC_VERSION"

      - name: Deploy hosting and Firestore rules/indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RASKI_TEST }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting,firestore --project "$PROJECT_ID" --non-interactive
